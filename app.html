<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b0c0f" />
  <title>MINISTRE AI — Intelligence souveraine</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0c0f}
    #minister-shell{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0b0c0f}
  </style>
</head>
<body>
  <iframe id="minister-shell" title="MINISTRE AI" src="/index.html" allow="clipboard-read; clipboard-write"></iframe>
  <script>
    const shell=document.getElementById('minister-shell');
    const initialHash=location.hash||'#briefing';
    shell.src='/index.html'+initialHash;
    shell.addEventListener('load',()=>{
      try{
        const d=shell.contentDocument;
        if(!d||d.getElementById('ministre-ai-live-client'))return;
        const s=d.createElement('script');
        s.id='ministre-ai-live-client';
        s.src='/ai-client.js';
        d.body.appendChild(s);
      }catch(e){console.error('MINISTRE AI bootstrap',e)}
    });
  </script>
</body>
</html>
